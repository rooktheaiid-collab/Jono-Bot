}

:root[data-theme=pixel]{--bg0:#ffd84a;--bg1:#ffd84a;--fg:#14103a;--fg2:#14103a;--card:#fff;--card2:#fff;--bd:#14103a;--bd2:#14103a;--nav:#ff4fa3;--navbd:#14103a;--mut:#14103a;--mut2:#14103a;--ub:#ff2d95;--ubt:#fff;--mb:#00e5ff;--ttl:#14103a;--ring:#fff;--dang:#e00040;--a:#ff2d95;--b:#00e5ff;--c:#ffe600;--mono:"PS2P",ui-monospace,monospace;--px:"PS2P",ui-monospace,monospace}
:root[data-theme=pixel] body{background:radial-gradient(#ff9a1f 22%,#0000 24%) 0 0/12px 12px,#ffd84a;color:var(--fg);font-family:var(--px)}
:root[data-theme=pixel] header{display:flex;align-items:center;justify-content:space-between;text-align:left;padding:14px 16px 8px}
:root[data-theme=pixel] h1{background:none;-webkit-background-clip:initial;color:#ff2d95;font:400 15px var(--px);letter-spacing:.04em;text-shadow:3px 3px 0 #14103a;display:flex;align-items:center;gap:8px}
:root[data-theme=pixel] .logo{display:inline-block;background:#00e5ff;color:#14103a;border:3px solid #14103a;padding:3px 4px 1px;font:400 11px var(--px);text-shadow:none;box-shadow:3px 3px 0 #14103a}
:root[data-theme=pixel] .model{display:block;font:400 7px var(--px);color:#14103a;text-align:right;line-height:1.6;background:#fff;border:3px solid #14103a;padding:4px 5px 2px}
:root[data-theme=pixel] #st{display:none}
:root[data-theme=pixel] main{margin:4px 16px 0;border:4px solid #14103a;border-radius:0;background:#2a1a8f;box-shadow:6px 6px 0 #14103a,inset 0 0 0 4px #00e5ff;overflow:hidden;min-height:200px;clip-path:polygon(0 8px,8px 8px,8px 0,calc(100% - 14px) 0,calc(100% - 14px) 8px,calc(100% - 6px) 8px,calc(100% - 6px) 100%,6px 100%,6px calc(100% - 8px),0 calc(100% - 8px))}
:root[data-theme=pixel] main::after{content:"";position:absolute;inset:0;pointer-events:none;background:conic-gradient(#0000 25%,#ffffff12 0 50%,#0000 0 75%,#ffffff12 0) 0 0/6px 6px}
:root[data-theme=pixel] main::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(#ff2d9533,#0000 40%,#00e5ff33)}
:root[data-theme=pixel] #orbbox{width:min(44vw,32vh,180px)}
:root[data-theme=pixel] #osd{display:block;position:absolute;top:14px;left:16px;right:14px;font:400 9px/1.4 var(--px);color:#ffe600;text-shadow:2px 2px 0 #14103a;text-transform:uppercase;z-index:2}
:root[data-theme=pixel] #scope{display:block;position:absolute;left:14px;right:14px;bottom:12px;width:calc(100% - 28px);height:38px;z-index:1;image-rendering:pixelated}
:root[data-theme=pixel] .halo{display:none}
:root[data-theme=pixel] .breath{clip-path:polygon(30% 0,70% 0,70% 10%,85% 10%,85% 20%,90% 20%,90% 30%,100% 30%,100% 70%,90% 70%,90% 80%,85% 80%,85% 90%,70% 90%,70% 100%,30% 100%,30% 90%,15% 90%,15% 80%,10% 80%,10% 70%,0 70%,0 30%,10% 30%,10% 20%,15% 20%,15% 10%,30% 10%)}
:root[data-theme=pixel] .orb{border-radius:0;box-shadow:none;opacity:1;background:conic-gradient(from 0deg,#ff2d95 0 25%,#ffe600 0 50%,#00e5ff 0 75%,#fff 0 100%);animation-timing-function:steps(24)}
:root[data-theme=pixel] .orb::after{border-radius:0;background:conic-gradient(#0000 25%,#14103a30 0 50%,#0000 0 75%,#14103a30 0) 0 0/8px 8px}
:root[data-theme=pixel] .tint{border-radius:0}
:root[data-theme=pixel] .tint.l{background:#00e5ffcc}
:root[data-theme=pixel] .tint.t{background:#ffe600cc}
:root[data-theme=pixel] .tint.s{background:#ff2d95cc}
:root[data-theme=pixel] #orbbox[data-state=idle] .orb{opacity:.75}
:root[data-theme=pixel] .ring{border-radius:0;border:4px dashed #fff}
:root[data-theme=pixel] .ripple{border-radius:0;border:4px solid #ffe600}
:root[data-theme=pixel] .arc{border-radius:0;background:none;-webkit-mask:none;mask:none;border:5px dashed #fff;inset:-10%}
:root[data-theme=pixel] #orbbox .arc{animation-timing-function:steps(8)}
:root[data-theme=pixel] .knobs{display:flex;justify-content:space-around;align-items:flex-start;margin:14px 16px 0;padding:10px 6px 8px;background:#fff;border:4px solid #14103a;box-shadow:5px 5px 0 #14103a}
:root[data-theme=pixel] .knobwrap{font:400 7px/1.5 var(--px);color:#14103a;letter-spacing:0;min-width:80px}
:root[data-theme=pixel] .knob{width:42px;height:42px;border-radius:0;background:#00e5ff;border:4px solid #14103a;box-shadow:3px 3px 0 #14103a}
:root[data-theme=pixel] #kvb .knob{background:#ffe600}
:root[data-theme=pixel] .knob:nth-child(1)::before{display:none}
:root[data-theme=pixel] .knob::before{display:none}
:root[data-theme=pixel] .knob i::after{top:3px;width:6px;height:6px;margin-left:-3px;border-radius:0;background:#ff2d95;box-shadow:none}
:root[data-theme=pixel] #log{height:15vh;min-height:78px;margin:14px 16px 0;padding:8px 10px;border-radius:0;background:#fff;border:4px solid #14103a;box-shadow:5px 5px 0 #14103a;mask-image:none;-webkit-mask-image:none;gap:6px}
:root[data-theme=pixel] .msg{max-width:100%;padding:3px 5px;border-radius:0;border:0;font:400 9px/1.6 var(--px);color:#14103a;animation-timing-function:steps(4)}
:root[data-theme=pixel] .u{align-self:flex-start;background:#ffb3d9;color:#14103a}
:root[data-theme=pixel] .m{align-self:flex-start;background:#b3f5ff}

<script>

function play(buf){const i=new Int16Array(buf),f=new Float32Array(i.length);for(let k=0;k<i.length;k++)f[k]=i[k]/32768;
 const ab=ctx.createBuffer(1,f.length,24000);ab.copyToChannel(f,0);const s=ctx.createBufferSource();s.buffer=ab;s.connect(an);
 lastUser=0;if(state!='speaking')setState('speaking');const t=Math.max(ctx.currentTime,playT);s.start(t);playT=t+ab.duration;srcs.push(s);s.onended=()=>{srcs=srcs.filter(x=>x!=s)};}
function flush(){srcs.forEach(s=>{try{s.stop()}catch(e){}});srcs=[];playT=0;}
function stop(keep){on=false;flush();cancelAnimationFrame(raf);an=null;lvlIn=0;lvlO=lvlM=0;lastUser=0;sc=1;ow.classList.remove('act');ow.style.transform='';rg.style.transform='';if(state!='idle'){state='idle';box.dataset.state='idle';}document.body.dataset.state='idle';kmo(0,0);drawScope();try{ws.close()}catch(e){}try{mic.getTracks().forEach(t=>t.stop())}catch(e){}try{ctx.close()}catch(e){}$('bt').textContent='Mulai ngobrol';b.className='';if(!keep)st('siap');}
pcEl.addEventListener('keydown',e=>{if(e.key=='Enter'&&pcEl.value){localStorage.setItem('pc',pcEl.value);pcEl.value='';pcEl.style.display='none';b.click();}});
$('reset').onclick=()=>{localStorage.removeItem('pc');pcEl.style.display='block';pcEl.focus();st('masukkan passcode baru');};
b.onclick=()=>{if(pcEl.style.display=='block'&&pcEl.value){localStorage.setItem('pc',pcEl.value);pcEl.value='';pcEl.style.display='none';}on?stop():start().catch(e=>{st('gagal: '+e.message);stop(true);});};

// history + menus
let H=JSON.parse(localStorage.getItem('hist')||'[]'),curSess=null;
function saveH(){localStorage.setItem('hist',JSON.stringify(H.slice(-300)));}
function rec(role,t){if(!curSess||curSess.end){curSess={t:Date.now(),m:[]};H.push(curSess);}const l=curSess.m[curSess.m.length-1];if(l&&l.r==role)l.x+=t;else curSess.m.push({r:role,x:t});saveH();}
const _add=add;add=function(c,t){_add(c,t);rec(c,t);};
function renderH(){const el=$('hl');const ss=H.filter(x=>x.m.length).slice().reverse();if(!ss.length){el.innerHTML='<div class="empty">Belum ada percakapan</div>';return;}
 el.innerHTML='';ss.forEach(x=>{const c=document.createElement('div');c.className='card';const h=document.createElement('h3');h.textContent=new Date(x.t).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'});c.appendChild(h);
 x.m.forEach(m=>{const d=document.createElement('div');d.textContent=(m.r=='u'?'Kamu: ':'Instinct: ')+m.x;d.style.opacity=m.r=='u'?.8:1;d.style.marginBottom='4px';c.appendChild(d);});el.appendChild(c);});}
document.querySelectorAll('nav button').forEach(n=>n.onclick=()=>{document.querySelectorAll('nav button,.view').forEach(e=>e.classList.remove('act'));n.classList.add('act');$(n.dataset.v).classList.add('act');if(n.dataset.v=='hist')renderH();if(n.dataset.v=='int'&&window.__intLoad)window.__intLoad();if(n.dataset.v=='set')chk();if(n.dataset.v=='bot')loadBot();});
async function chk(){const e=$('ss');e.textContent='memeriksa...';try{const j=await (await fetch('https://'+HOST+'/status',{cache:'no-store'})).json();e.innerHTML='<span class="dot '+(j.key_present?'ok':'bad')+'"></span>Voice server aktif<br><span class="hs">Model: '+j.model+'</span>';}catch(x){e.innerHTML='<span class="dot bad"></span>Server tidak terjangkau';}}
$('hn').textContent=HOST;$('rf').onclick=chk;
$('sp').onclick=()=>{const v=$('np').value;if(v){localStorage.setItem('pc',v);$('np').value='';$('sp').textContent='Tersimpan ✓';setTimeout(()=>$('sp').textContent='Simpan passcode',1500);}};
$('ch').onclick=()=>{if(confirm('Hapus semua riwayat?')){H=[];curSess=null;saveH();$('ch').textContent='Terhapus ✓';}};

$('vs').value=localStorage.getItem('voice')||'';$('vs').onchange=()=>localStorage.setItem('voice',$('vs').value);
function wib(l){const m=l.match(/^(\d{4}-\d\d-\d\d) (\d\d:\d\d):\d\d,\d+ (.*)$/);if(!m)return l;const d=new Date(m[1]+'T'+m[2]+':00+08:00');return d.toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+' · '+m[3].replace(/^(INFO|WARNING|ERROR) /,(x)=>x=='INFO '?'':x);}
async function loadBot(){const s=$('bs');s.textContent='memuat...';try{const r=await fetch('https://'+HOST+'/api/bot?pc='+encodeURIComponent(getPc()),{cache:'no-store'});if(r.status==403){s.innerHTML='<span class="dot bad"></span>Passcode salah, ganti di Setelan';return;}const j=await r.json();const ok=j.active=='active';
 s.innerHTML='<span class="dot '+(ok?'ok':'bad')+'"></span>'+(ok?'Bot jalan':'Bot tidak aktif ('+j.active+')')+'<br><span class="hs">Mode testnet, sinyal saja (tanpa order)</span>';
 $('bsig').textContent=j.last_signal?wib(j.last_signal):'Belum ada sinyal masuk di log terbaru';
 $('bl').innerHTML='';(j.lines||[]).slice().reverse().forEach(l=>{const d=document.createElement('div');d.textContent=wib(l);d.style.marginBottom='5px';$('bl').appendChild(d);});}catch(e){s.innerHTML='<span class="dot bad"></span>Server tidak terjangkau';}}
$('br').onclick=loadBot;


let TB=null,ph=0;const SC=$('scope'),SX=SC&&SC.getContext('2d');
const isRetro=()=>{const t=document.documentElement.dataset.theme;return t=='retro'||t=='pixel'};
function kmo(m,o){if(!isRetro())return;$('km').style.transform='rotate('+(-120+Math.min(1,m*1.6)*240)+'deg)';$('ko').style.transform='rotate('+(-120+Math.min(1,o*1.6)*240)+'deg)';}
function drawScope(){if(!SX||!isRetro())return;const w=SC.width,h=SC.height,mid=h/2;SX.clearRect(0,0,w,h);
 const PX=document.documentElement.dataset.theme=='pixel';SX.strokeStyle=PX?'#ffe600':'#12300a';SX.lineWidth=PX?5:2.5;SX.lineJoin=PX?'miter':'round';SX.beginPath();ph+=.35;
 let SY=0;const spk=state=='speaking'&&TB&&an;const amp=state=='listening'?Math.min(1,lvlM*2):0;
 for(let x=0;x<=w;x+=(PX?10:4)){let y;
  if(spk){y=mid+((TB[Math.floor(x/w*(TB.length-1))]-128)/128)*mid*1.3;}
  else{y=mid+Math.sin(x*.045+ph)*mid*(.04+amp*.8)*Math.sin(x/w*Math.PI)+(amp?(Math.random()-.5)*mid*amp*.5:0);}
  if(PX){y=Math.round(y/5)*5;x?(SX.lineTo(x,SY),SX.lineTo(x,y)):SX.moveTo(x,y);SY=y;}else{x?SX.lineTo(x,y):SX.moveTo(x,y);}}
 SX.stroke();}
const VOICES=['','Puck','Charon','Kore','Fenrir','Aoede','Leda','Orus','Zephyr'];
function syncVoice(){const v=localStorage.getItem('voice')||'';let i=Math.max(0,VOICES.indexOf(v));$('kv').style.transform='rotate('+(-120+i*(240/(VOICES.length-1)))+'deg)';$('kvl').textContent='SUARA: '+(v?v.toUpperCase():'DEFAULT');$('vs').value=v;}
$('kvb').onclick=()=>{const v=localStorage.getItem('voice')||'';const i=(Math.max(0,VOICES.indexOf(v))+1)%VOICES.length;localStorage.setItem('voice',VOICES[i]);syncVoice();try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}};
$('vs').addEventListener('change',syncVoice);syncVoice();

function applyTheme(){const m=localStorage.getItem('theme')||'pixel';const t=m=='auto'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):m;document.documentElement.dataset.theme=t;const C={pixel:['#ffd84a','#ff4fa3',1,'#ffd84a'],retro:['#c9c3b1','#b3ad9a',1,'#c9c3b1'],light:['#f4f5fc','#ffffff',1,'#f4f5fc'],dark:['#07080f','#0a0b18',0,'#07080f']}[t];$('tc').content=C[3];try{Android.setBarsColors(C[0],C[1],!!C[2])}catch(e){try{Android.setBars(t=='light')}catch(x){}}drawScope();kmo(0,0);}
$('ts').value=localStorage.getItem('theme')||'pixel';$('ts').onchange=()=>{localStorage.setItem('theme',$('ts').value);applyTheme();};
matchMedia('(prefers-color-scheme: light)').addEventListener&&matchMedia('(prefers-color-scheme: light)').addEventListener('change',applyTheme);applyTheme();
const _stop=stop;stop=function(k){if(curSess)curSess.end=1;_stop(k);};
</script></body></html>
